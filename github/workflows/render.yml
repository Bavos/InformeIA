name: Render Remotion Video

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  render:
    name: Render and Export MP4
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install FFmpeg and Chrome dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg chromium-browser

      - name: Install NPM Dependencies
        run: npm ci

      - name: Render Video with Remotion Script
        run: node scripts/render.mjs

      - name: Upload Video Artifact for Download
        uses: actions/upload-artifact@v4
        with:
          name: remotion-video-ai-governance
          path: out/video-ai-governance.mp4
          retention-days: 7
